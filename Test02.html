</style></head><body><div class="wrap"><a class="backlink no-print" href="index.html">← 전체 TEST 목록</a><div class="hero"><h1>해커스 토익 LC TEST 02 단어 학습</h1><p>SECTION A · B · C · D / 총 200개 어휘</p></div>

ith", "ko": "~을 처리하다"}, {"en": "disruption", "ko": "중단"}, {"en": "restore", "ko": "복구하다"}, {"en": "alert", "ko": "알림"}, {"en": "restoration", "ko": "복구"}, {"en": "suburb", "ko": "교외"}, {"en": "town hall meeting", "ko": "주민 회의"}, {"en": "objection", "ko": "반대 의견, 이의"}, {"en": "get a glimpse of", "ko": "~을 미리 보다"}, {"en": "architectural", "ko": "건축의"}, {"en": "election", "ko": "선거"}, {"en": "approve of", "ko": "~을 승인하다, 찬성하다"}, {"en": "historical", "ko": "역사적인"}, {"en": "collaboration", "ko": "협력, 협업"}, {"en": "efficient", "ko": "효율적인"}, {"en": "mandatory", "ko": "의무적인"}, {"en": "notepad", "ko": "수첩"}, {"en": "speech recognition", "ko": "음성 인식"}, {"en": "value", "ko": "소중히 여기다, 가치 있게 생각하다"}, {"en": "aspect", "ko": "측면"}, {"en": "translation", "ko": "번역"}, {"en": "indicate", "ko": "나타내다"}, {"en": "specify", "ko": "명시하다"}, {"en": "due", "ko": "마감인"}, {"en": "subsequent", "ko": "다음의, 그 이후의"}, {"en": "scrub", "ko": "문질러 씻다"}, {"en": "dust", "ko": "먼지를 털다"}, {"en": "rate", "ko": "요금"}, {"en": "celebrate", "ko": "축하하다"}, {"en": "promotional code", "ko": "할인 코드, 프로모션 코드"}, {"en": "time off", "ko": "휴식 시간"}, {"en": "award", "ko": "상"}, {"en": "specialized", "ko": "전문가용의, 특화된"}, {"en": "return one’s call", "ko": "회신 전화하다"}, {"en": "cooperate", "ko": "협력하다"}, {"en": "safety", "ko": "안전"}]}};window.TEST_PRIMARY='#059669';</script><script>
const DATA=window.TEST_DATA;
const primary=window.TEST_PRIMARY;document.documentElement.style.setProperty('--primary',primary);
const allWords=Object.values(DATA.sections).flat();
let currentQuiz=[];let currentType='';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function show(id){document.querySelectorAll('[data-view]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
function backHome(){show('home');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderVocab(sec='ALL'){
 show('vocab');const box=document.getElementById('vocabBody');let rows=[];
 if(sec==='ALL'){Object.entries(DATA.sections).forEach(([s,arr])=>arr.forEach((w,i)=>rows.push([s,i+1,w])))}else DATA.sections[sec].forEach((w,i)=>rows.push([sec,i+1,w]));
 box.innerHTML=`<table><thead><tr><th class="n">구분</th><th>영어 어휘</th><th>뜻</th></tr></thead><tbody>${rows.map(([s,i,w])=>`<tr><td><span class="badge">${s}-${i}</span></td><td><b>${esc(w.en)}</b></td><td>${esc(w.ko)}</td></tr>`).join('')}</tbody></table>`;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.sec===sec));
}
function makeQuiz(type,count=40){
 currentType=type;currentQuiz=shuffle(allWords).slice(0,Math.min(count,allWords.length));show('quiz');
 document.getElementById('quizTitle').textContent=type==='choice'?'랜덤 4지선다 퀴즈':'랜덤 주관식 퀴즈';
 document.getElementById('quizMeta').textContent=`${currentQuiz.length}문항 · TEST ${String(DATA.test).padStart(2,'0')} 전체 200개에서 출제`;
 const area=document.getElementById('quizBody');
 if(type==='choice'){
   area.innerHTML=currentQuiz.map((w,i)=>{let wrong=shuffle(allWords.filter(x=>x.en!==w.en && x.ko!==w.ko)).slice(0,3);let opts=shuffle([...wrong,w]);return `<div class="card" data-answer="${esc(w.ko)}"><b>${i+1}. 다음 단어의 알맞은 뜻은?</b><div class="qword">${esc(w.en)}</div><div class="choices">${opts.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${esc(o.ko)}">${['①','②','③','④'][j]} ${esc(o.ko)}</label>`).join('')}</div><div class="model-answer hidden"></div></div>`}).join('');
 }else{
   area.innerHTML=currentQuiz.map((w,i)=>`<div class="card" data-answer="${esc(w.ko)}"><b>${i+1}.</b><div class="qword">${esc(w.en)}</div><input class="answer" placeholder="뜻을 입력해 보세요 (제출 후 모범답안 확인)"/><div class="model-answer hidden"></div></div>`).join('');
 }
 document.getElementById('quizResult').classList.add('hidden');document.getElementById('submitBtn').disabled=false;
}
function submitQuiz(){
 let score=0,answered=0;document.querySelectorAll('#quizBody .card').forEach((card,i)=>{const ans=card.dataset.answer;const ma=card.querySelector('.model-answer');ma.classList.remove('hidden');ma.textContent='모범답안: '+ans;if(currentType==='choice'){const sel=card.querySelector('input:checked');if(sel){answered++;if(sel.value===ans){score++;card.classList.add('correct')}else card.classList.add('wrong')}}else{const inp=card.querySelector('input.answer');if(inp.value.trim())answered++;}
 });
 const r=document.getElementById('quizResult');r.classList.remove('hidden');r.innerHTML=currentType==='choice'?`<b>채점 결과: ${score} / ${currentQuiz.length}</b><br><span class="note">응답 ${answered}문항. 오답 카드에는 모범답안이 표시됩니다.</span>`:`<b>주관식 답안 공개 완료</b><br><span class="note">주관식은 표현이 다양해 자동채점하지 않고, 입력 답안과 모범답안을 직접 비교하도록 구성했습니다.</span>`;document.getElementById('submitBtn').disabled=true;r.scrollIntoView({behavior:'smooth'});
}
</script></body></html>
