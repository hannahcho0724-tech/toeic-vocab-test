</style></head><body><div class="wrap"><a class="backlink no-print" href="index.html">← 전체 TEST 목록</a><div class="hero"><h1>해커스 토익 LC TEST 01 단어 학습</h1><p>SECTION A · B · C · D / 총 200개 어휘</p></div>
<div id="home" data-view class="panel"><div class="menu"><button class="btn" onclick="renderVocab('ALL')">📚 전체 200개 단어장</button><button class="btn" onclick="makeQuiz('choice',40)">✍️ 랜덤 4지선다 40</button><button class="btn" onclick="makeQuiz('word',40)">🎯 랜덤 주관식 40</button></div><p class="note">퀴즈 정답은 제출 전에는 표시되지 않습니다. 새로 시작할 때마다 문제가 무작위로 바뀝니다.</p></div>
<div id="vocab" data-view class="panel hidden"><div class="toolbar no-print"><button class="btn secondary" onclick="backHome()">← 메인</button><div class="section-tabs"><button class="tab active" data-sec="ALL" onclick="renderVocab('ALL')">전체</button><button class="tab" data-sec="A" onclick="renderVocab('A')">A</button><button class="tab" data-sec="B" onclick="renderVocab('B')">B</button><button class="tab" data-sec="C" onclick="renderVocab('C')">C</button><button class="tab" data-sec="D" onclick="renderVocab('D')">D</button></div></div><div id="vocabBody"></div></div>

<script>window.TEST_DATA={"test": 1, "sections": {"A": [{"en": "side by side", "ko": "나란히"}, {"en": "lean against", "ko": "~에 기대다"}, {"en": "column", "ko": "기둥"}, {"en": "platform", "ko": "승강장"}, {"en": "pile up", "ko": "쌓다"}, {"en": "diner", "ko": "식사하는 사람"}, {"en": "organize", "ko": "정리하다"}, {"en": "adjust", "ko": "고쳐 쓰다, 조정하다"}, {"en": "fasten", "ko": "매다, 채우다"}, {"en": "examine", "ko": "살펴보다"}, {"en": "blueprint", "ko": "설계도, 청사진"}, {"en": "reach for", "ko": "~을 향해 손을 뻗다"}, {"en": "stack", "ko": "쌓다"}, {"en": "assemble", "ko": "조립하다"}, {"en": "situate", "ko": "위치시키다"}, {"en": "entrance", "ko": "입구"}, {"en": "wheelbarrow", "ko": "손수레"}, {"en": "lead up to", "ko": "~로 이어지다"}, {"en": "reception area", "ko": "접수처"}, {"en": "submit", "ko": "제출하다"}, {"en": "hand in", "ko": "제출하다"}, {"en": "lease agreement", "ko": "임대 계약서"}, {"en": "thoroughly", "ko": "철저히"}, {"en": "solution", "ko": "해결책"}, {"en": "incredibly", "ko": "믿을 수 없을 정도로"}, {"en": "contact information", "ko": "연락처"}, {"en": "approval", "ko": "승인"}, {"en": "exhibition", "ko": "전시회"}, {"en": "hallway", "ko": "복도"}, {"en": "hiking trail", "ko": "등산로"}, {"en": "available", "ko": "이용 가능한, 주문 가능한"}, {"en": "source", "ko": "공급받다"}, {"en": "handle", "ko": "처리하다"}, {"en": "share a ride", "ko": "카풀하다, 합승하다"}, {"en": "promote", "ko": "진급시키다, 승진시키다"}, {"en": "internal", "ko": "내부의"}, {"en": "candidate", "ko": "후보자"}, {"en": "external", "ko": "외부의"}, {"en": "sidewalk", "ko": "보도"}, {"en": "in person", "ko": "직접"}, {"en": "launch", "ko": "출시"}, {"en": "postpone", "ko": "연기하다"}, {"en": "overseas", "ko": "해외에서"}, {"en": "promptly", "ko": "지체 없이, 즉시"}, {"en": "keep track of", "ko": "~을 파악하다, 기록하다"}, {"en": "miscalculation", "ko": "계산 오류, 오판"}, {"en": "extremely", "ko": "극도로, 매우"}, {"en": "at the last minute", "ko": "마지막 순간에, 임박해서"}, {"en": "prototype", "ko": "시제품"}, {"en": "steadily", "ko": "계속해서, 끊임없이"}], "B": [{"en": "come up with", "ko": "~을 생각해 내다"}, {"en": "presence", "ko": "입지, 존재감"}, {"en": "delayed", "ko": "지연된"}, {"e 서두르다, 가속하다"}, {"en": "cost estimate", "ko": "비용 견적서"}, {"en": "contractor", "ko": "계약업체, 도급업자"}, {"en": "quote", "ko": "견적액"}, {"en": "charge", "ko": "청구하다"}, {"en": "labor cost", "ko": "인건비"}, {"en": "anticipate", "ko": "예상하다"}, {"en": "unreasonable", "ko": "불합리한"}, {"en": "quality", "ko": "품질"}, {"en": "oversee", "ko": "감독하다"}, {"en": "construction firm", "ko": "건설 회사"}, {"en": "go on", "ko": "진행되다"}, {"en": "regular price", "ko": "정가"}, {"en": "unit", "ko": "제품, 단위"}, {"en": "stockroom", "ko": "창고"}, {"en": "give away", "ko": "무료로 주다, 증정하다"}, {"en": "complimentary", "ko": "무료의"}, {"en": "pick out", "ko": "고르다"}, {"en": "wall display", "ko": "벽면 진열대"}, {"en": "sign up for", "ko": "~에 가입하다"}, {"en": "accessory", "ko": "액세서리, 부속품"}, {"en": "book fair", "ko": "도서 박람회"}, {"en": "participate in", "ko": "~에 참가하다"}, {"en": "venue", "ko": "장소"}, {"en": "organizing committee", "ko": "조직 위원회"}, {"en": "floor plan", "ko": "평면도"}, {"en": "foot traffic", "ko": "유동 인구"}, {"en": "inbox", "ko": "받은 편지함"}, {"en": "attract", "ko": "끌어들이다"}, {"en": "manage to", "ko": "간신히 ~하다"}, {"en": "performance", "ko": "공연"}, {"en": "supplement", "ko": "보충제"}, {"en": "logistics", "ko": "물류"}, {"en": "passenger", "ko": "승객"}, {"en": "apologize", "ko": "죄송하다, 사과하다"}, {"en": "commence", "ko": "시작되다"}, {"en": "approach", "ko": "~로 가다, 접근하다"}, {"en": "overbooking", "ko": "초과 예약"}, {"en": "severe", "ko": "심각한, 극심한"}, {"en": "luggage", "ko": "수하물"}, {"en": "expand", "ko": "확장하다"}, {"en": "innovative", "ko": "혁신적인"}], "D": [{"en": "exclusive", "ko": "독점적인, 전용의"}, {"en": "expert", "ko": "전문가"}, {"en": "investor", "ko": "투자자"}, {"en": "visualization", "ko": "시각화"}, {"en": "existing", "ko": "기존의"}, {"en": "structure", "ko": "구조물"}, {"en": "detour", "ko": "우회로"}, {"en": "journalist", "ko": "기자"}, {"en": "city council", "ko": "시의회"}, {"en": "feasible", "ko": "실현 가능한"}, {"en": "correctly", "ko": "제대로, 정확하게"}, {"en": "timeline", "ko": "일정표"}, {"en": "finalize", "ko": "마무리 짓다, 확정하다"}, {"en": "alternative", "ko": "대안, 대체품"}, {"en": "regarding", "ko": "~에 관하여"}, {"en": "ensure", "ko": "보장하다, 확실하게 하다"}, {"en": "arrangement", "ko": "준비, 마련"}, {"en": "job opening", "ko": "일자리, 공석"}, {"en": "spicy", "ko": "매운"}, {"en": "seasoning", "ko": "양념"}, {"en": "locally", "ko": "현지에서"}, {"en": "organizer", "ko": "주최자"}, {"en": "introduce", "ko": "소개하다"}, {"en": "decade", "ko": "10년"}, {"en": "advise", "ko": "조언하다"}, {"en": "in advance", "ko": "미리, 사전에"}, {"en": "register", "ko": "등록하다"}, {"en": "prominence", "ko": "명성, 중요성"}, {"en": "distribute", "ko": "배포하다"}, {"en": "summarize", "ko": "요약하다"}, {"en": "academic journal", "ko": "학술지"}, {"en": "opportunity", "ko": "기회"}, {"en": "lead", "ko": "이끌다, 진행하다"}, {"en": "attendee", "ko": "참석자"}, {"en": "promotion", "ko": "판촉 행사"}, {"en": "directly", "ko": "직접적으로"}, {"en": "educational", "ko": "교육의"}, {"en": "botanical", "ko": "식물의"}, {"en": "inquiry", "ko": "문의"}, {"en": "in stock", "ko": "재고가 있는"}, {"en": "fabric", "ko": "직물, 천"}, {"en": "decoration", "ko": "장식"}, {"en": "crucial", "ko": "중요한"}, {"en": "unique", "ko": "독특한"}, {"en": "advanced", "ko": "첨단의"}, {"en": "electricity", "ko": "전기"}, {"en": "artifact", "ko": "인공물, 유물"}, {"en": "machinery", "ko": "기계류"}, {"en": "temporarily", "ko": "일시적으로"}, {"en": "architecture", "ko": "건축물"}]}};window.TEST_PRIMARY='#2563eb';</script><script>
const DATA=window.TEST_DATA;
const primary=window.TEST_PRIMARY;document.documentElement.style.setProperty('--primary',primary);
const allWords=Object.values(DATA.sections).flat();
let currentQuiz=[];let currentType='';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function show(id){document.querySelectorAll('[data-view]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
function backHome(){show('home');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderVocab(sec='ALL'){
 show('vocab');const box=document.getElementById('vocabBody');let rows=[];
 if(sec==='ALL'){Object.entries(DATA.sections).forEach(([s,arr])=>arr.forEach((w,i)=>rows.push([s,i+1,w])))}else DATA.sections[sec].forEach((w,i)=>rows.push([sec,i+1,w]));
 box.innerHTML=`<table><thead><tr><th class="n">구분</th><th>영어 어휘</th><th>뜻</th></tr></thead><tbody>${rows.map(([s,i,w])=>`<tr><td><span class="badge">${s}-${i}</span></td><td><b>${esc(w.en)}</b></td><td>${esc(w.ko)}</td></tr>`).join('')}</tbody></table>`;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.sec===sec));
}
function makeQuiz(type,count=40){
 currentType=type;currentQuiz=shuffle(allWords).slice(0,Math.min(count,allWords.length));show('quiz');
 document.getElementById('quizTitle').textContent=type==='choice'?'랜덤 4지선다 퀴즈':'랜덤 주관식 퀴즈';
 document.getElementById('quizMeta').textContent=`${currentQuiz.length}문항 · TEST ${String(DATA.test).padStart(2,'0')} 전체 200개에서 출제`;
 const area=document.getElementById('quizBody');
 if(type==='choice'){
   area.innerHTML=currentQuiz.map((w,i)=>{let wrong=shuffle(allWords.filter(x=>x.en!==w.en && x.ko!==w.ko)).slice(0,3);let opts=shuffle([...wrong,w]);return `<div class="card" data-answer="${esc(w.ko)}"><b>${i+1}. 다음 단어의 알맞은 뜻은?</b><div class="qword">${esc(w.en)}</div><div class="choices">${opts.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${esc(o.ko)}">${['①','②','③','④'][j]} ${esc(o.ko)}</label>`).join('')}</div><div class="model-answer hidden"></div></div>`}).join('');
 }else{
   area.innerHTML=currentQuiz.map((w,i)=>`<div class="card" data-answer="${esc(w.ko)}"><b>${i+1}.</b><div class="qword">${esc(w.en)}</div><input class="answer" placeholder="뜻을 입력해 보세요 (제출 후 모범답안 확인)"/><div class="model-answer hidden"></div></div>`).join('');
 }
 document.getElementById('quizResult').classList.add('hidden');document.getElementById('submitBtn').disabled=false;
}
function submitQuiz(){
 let score=0,answered=0;document.querySelectorAll('#quizBody .card').forEach((card,i)=>{const ans=card.dataset.answer;const ma=card.querySelector('.model-answer');ma.classList.remove('hidden');ma.textContent='모범답안: '+ans;if(currentType==='choice'){const sel=card.querySelector('input:checked');if(sel){answered++;if(sel.value===ans){score++;card.classList.add('correct')}else card.classList.add('wrong')}}else{const inp=card.querySelector('input.answer');if(inp.value.trim())answered++;}
 });
 const r=document.getElementById('quizResult');r.classList.remove('hidden');r.innerHTML=currentType==='choice'?`<b>채점 결과: ${score} / ${currentQuiz.length}</b><br><span class="note">응답 ${answered}문항. 오답 카드에는 모범답안이 표시됩니다.</span>`:`<b>주관식 답안 공개 완료</b><br><span class="note">주관식은 표현이 다양해 자동채점하지 않고, 입력 답안과 모범답안을 직접 비교하도록 구성했습니다.</span>`;document.getElementById('submitBtn').disabled=true;r.scrollIntoView({behavior:'smooth'});
}
</script></body></html>
